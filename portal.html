  id uuid primary key default gen_random_uuid(),
  kind text not null check (kind in ('holiday','showcase','custom')),
  subject text not null,
  body text not null,
  nd date not null default current_date,
  status text not null default 'confirmed' check (status in ('draft','confirmed')),
  to_all boolean not null default true,
  vis text[] not null default '{}',
  meta jsonb not null default '{}'::jsonb,
  created_at timestamptz not null default now()
);
alter table public.notices enable row level security;
create or replace function public.my_tids() returns text[] language sql stable security definer set search_path=public as $$
  select coalesce(array_agg(id::text),'{}'::text[]) from public.teachers where lower(email)=lower(coalesce(auth.jwt()->>'email','')) and coalesce(active,true)
$$;
drop policy if exists notices_admin on public.notices;
create policy notices_admin on public.notices for all to authenticated using (public.is_admin()) with check (public.is_admin());
drop policy if exists notices_teacher on public.notices;
create policy notices_teacher on public.notices for select to authenticated using (status='confirmed' and (to_all or vis && public.my_tids()));
grant select,insert,update,delete on public.notices to authenticated;
do $$ begin alter publication supabase_realtime add table public.notices; exception when others then null; end $$;`;
