<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><title>শিক্ষার্থী পোর্টাল</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b5a54">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--pr:#0f766e;--prd:#0b5a54;--prl:#e6f4f2;--pr2:#14b8a6;--prdd:#083f3b;--prsh:rgba(15,118,110,.4);--prcs:rgba(11,90,84,.28);--ac:#f59e0b;--acd:#b45309;--tx:#102a2d;--mu:#5f7478;--bd:#dfe7e8;--bg:#f2f6f6;--ok:#15803d;--er:#dc2626;--lt:#d97706}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;color:var(--tx);background:var(--bg);min-height:100vh;overflow-x:hidden}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(6deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.45)}50%{box-shadow:0 0 0 10px rgba(220,38,38,0)}}
@keyframes shk{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-14deg)}94%{transform:rotate(12deg)}97%{transform:rotate(-8deg)}}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
.rise{opacity:0;animation:up .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
/* login */
.lg{min-height:100vh;display:grid;place-items:center;padding:24px 18px;position:relative;overflow:hidden;background:linear-gradient(135deg,#083f3b,var(--prd) 45%,var(--pr))}
.bl{position:absolute;border-radius:50%;opacity:.35;animation:float 9s ease-in-out infinite}
.b1{width:200px;height:200px;right:-60px;top:-50px;background:radial-gradient(circle at 30% 30%,#fcd34d,var(--ac))}
.b2{width:130px;height:130px;left:-30px;bottom:60px;background:radial-gradient(circle at 30% 30%,#5eead4,#0d9488);animation-delay:-3s}
.lt{position:absolute;font-weight:700;color:#fff;opacity:.13;animation:float 7s ease-in-out infinite}
.lc{position:relative;z-index:2;width:100%;max-width:400px;background:#fff;border-radius:28px;padding:28px 24px 22px;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:up .7s both}
.lc .lo{width:64px;height:64px;border-radius:20px;margin:-60px auto 12px;background:linear-gradient(135deg,var(--pr),var(--pr2));display:grid;place-items:center;box-shadow:0 10px 24px var(--prsh);overflow:hidden}.lc .lo img,.idlg{width:100%;height:100%;object-fit:cover}
.lc h1{text-align:center;font-size:24px;color:var(--prd)}.lc p.sb{text-align:center;color:var(--mu);font-size:14px;margin:4px 0 18px}
.fl{display:block;margin-bottom:12px}.fl span{font-size:13px;color:var(--mu);font-weight:600}
.fl input{width:100%;margin-top:4px;padding:13px 14px;font-size:16px;border:1.5px solid var(--bd);border-radius:14px;outline:0;background:#fafcfc;transition:.2s}
.fl input:focus{border-color:var(--pr);box-shadow:0 0 0 4px rgba(15,118,110,.12);background:#fff}
.pw{position:relative}.pw button{position:absolute;right:6px;bottom:6px;width:38px;height:38px;font-size:18px}
.bt{width:100%;padding:14px;border-radius:14px;color:#fff;font-weight:700;font-size:16px;background:linear-gradient(135deg,var(--pr),var(--pr2));box-shadow:0 10px 22px rgba(15,118,110,.3);transition:.2s}
.bt:active{transform:scale(.97)}.bt:disabled{opacity:.6}
.er{color:var(--er);font-size:14px;min-height:20px;margin:2px 0 8px;text-align:center}.er.s{animation:shk .5s}
.hn{margin-top:14px;padding:10px 12px;border-radius:12px;background:#fff7e6;color:var(--acd);font-size:13px;text-align:center}
.bk{display:block;text-align:center;margin-top:14px;color:var(--mu);font-size:13px;text-decoration:none}
/* app shell */
.hd{position:relative;overflow:hidden;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 56px;background:linear-gradient(135deg,#083f3b,var(--prd) 50%,var(--pr))}
.hd::after{content:"";position:absolute;inset:auto -10% -1px;height:34px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0}
.hi{position:relative;z-index:2;max-width:640px;margin:auto;display:flex;align-items:center;gap:13px}
.av{width:56px;height:56px;border-radius:50%;border:3px solid rgba(255,255,255,.7);object-fit:cover;background:#e6f4f2;flex:none}
.hi small{opacity:.85;font-size:13px;display:block}.hi h2{font-size:20px;line-height:1.25}.hi .ui{display:inline-block;margin-top:3px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:rgba(255,255,255,.18)}
.pg{max-width:640px;margin:-30px auto 0;padding:0 14px calc(100px + env(safe-area-inset-bottom));position:relative;z-index:3}
.c{background:#fff;border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 8px 26px rgba(11,90,84,.07)}
.c h3{font-size:16px;color:var(--prd);margin-bottom:10px}
.nv{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:620px;margin:auto;z-index:20;display:flex;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:24px;padding:6px;box-shadow:0 12px 34px rgba(11,90,84,.2)}
.nv button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 5px;border-radius:18px;color:var(--mu);font-size:11px;font-weight:600;transition:.3s}
.nv svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:.4s cubic-bezier(.2,1.6,.4,1)}
.nv button.on{color:#fff;background:linear-gradient(135deg,var(--pr),var(--pr2))}.nv button.on svg{transform:translateY(-2px) scale(1.15)}
.nv i{position:absolute;top:2px;right:calc(50% - 20px);min-width:17px;height:17px;border-radius:9px;background:var(--er);color:#fff;font-size:10px;font-style:normal;display:grid;place-items:center;animation:pulse 1.8s infinite}
/* home */
.bn{display:flex;gap:10px;align-items:center;padding:13px 14px;border-radius:18px;margin-bottom:14px;background:#fff7e6;color:var(--acd);font-weight:600;font-size:14px;border:1px solid #fde8b4}
.bn.r{background:#fef2f2;color:#991b1b;border-color:#fecaca;animation:pulse 2s infinite}
.nx{color:#fff;border:0;background:linear-gradient(135deg,var(--a,#0f766e),color-mix(in srgb,var(--a,#0f766e) 60%,#000));position:relative;overflow:hidden}
.nx::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14)}
.nx small{opacity:.85}.nx h3{color:#fff;font-size:24px;margin:2px 0}.nx .tm{margin-top:8px;display:inline-block;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.2);font-size:13px;font-weight:600}
.rw{display:flex;align-items:center;gap:16px}.rg{position:relative;width:118px;height:118px;flex:none}
.rg svg{transform:rotate(-90deg)}.rg circle{fill:none;stroke-width:11;stroke-linecap:round}
.rg .t{stroke:#eef3f3}.rg .f{transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.rg b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px}
.st3{flex:1;display:grid;gap:7px}.st3 div{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-radius:12px;font-weight:600;font-size:14px}
.st3 b{font-size:18px}
.sc{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}.sc::-webkit-scrollbar{display:none}
.tc{flex:none;width:130px;text-align:center;padding:14px 8px;border-radius:18px;background:color-mix(in srgb,var(--a) 10%,#fff);border:1px solid color-mix(in srgb,var(--a) 25%,#fff)}
.tc .ta{width:50px;height:50px;border-radius:50%;margin:0 auto 6px;background:var(--a);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700;overflow:hidden}.tc .ta img{width:100%;height:100%;object-fit:cover}
.tc b{display:block;color:var(--a)}.tc small{color:var(--mu);font-size:12px}
/* id card flip */
.flip{perspective:1400px;max-width:340px;margin:6px auto;cursor:pointer}.fi{display:grid;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.flip.on .fi{transform:rotateY(180deg)}.fa,.fb{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden}.fb{transform:rotateY(180deg)}
.idc{background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 18px 44px var(--prcs);text-align:center;border:1px solid var(--bd);position:relative}
.idh{position:relative;overflow:hidden;color:#fff;padding:20px 10px 64px;background:linear-gradient(135deg,var(--prdd),var(--pr))}
.idh i{position:absolute;border-radius:50%}.idh i:first-child{width:70px;height:70px;left:-20px;bottom:6px;background:rgba(245,158,11,.5)}.idh i:nth-child(2){width:100px;height:100px;right:-26px;top:-30px;background:rgba(255,255,255,.14)}
.idh b{display:block;font-size:24px;position:relative}.idlg{display:block;width:44px;height:44px;border-radius:12px;margin:0 auto 6px;background:#fff;position:relative}.idh small{opacity:.9;position:relative}
.idp{width:104px;height:104px;border-radius:50%;margin:-52px auto 0;border:5px solid #fff;overflow:hidden;position:relative;background:#e6f4f2;box-shadow:0 6px 16px rgba(0,0,0,.15)}.idp img{width:100%;height:100%;object-fit:cover}
.idn{font-size:22px;font-weight:700;margin-top:8px;padding:0 10px}.idcl{color:var(--mu);font-size:14px}
.idu{display:inline-block;margin-top:10px;padding:6px 20px;font-size:21px;font-weight:700;color:#92400e;background:#fef3c7;border:2px dashed var(--ac);border-radius:14px}
.idul{font-size:12px;color:var(--mu);margin-top:3px}
.idg{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;text-align:left;padding:12px 18px 0;font-size:12px;color:var(--mu)}.idg b{display:block;color:var(--tx);font-size:14px}
.idsb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:12px 14px 0}.idsb em{font-style:normal;font-size:12px;font-weight:700;padding:3px 10px;border-radius:9px}
.idbc{display:flex;justify-content:center;height:46px;gap:2px;margin:14px 0 12px}.idbc i{display:block;background:#12302f;height:100%}
.idf{background:#e6f4f2;color:var(--prd);padding:10px;font-size:13px;font-weight:600}
.idc::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:shine 5s infinite}
@keyframes shine{0%,60%{left:-80%}100%{left:140%}}
.fb{text-align:left}.fb .idh{padding:16px 16px 18px;text-align:left}.fb .idh small{display:block}
.fb .bd{padding:12px 16px}.fb table{width:100%;border-collapse:collapse;font-size:13px}.fb td,.fb th{padding:6px 3px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}.fb th{color:var(--mu);font-weight:600;font-size:12px}
.fb .nm{font-size:19px;font-weight:700}
.hint{text-align:center;color:var(--mu);font-size:13px;margin-top:12px}
/* routine */
.dps{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.dps::-webkit-scrollbar{display:none}
.dp{flex:none;min-width:58px;padding:9px 6px;border-radius:16px;background:#fff;border:1.5px solid var(--bd);font-weight:600;font-size:14px;position:relative;transition:.3s}
.dp.hs::after{content:"";position:absolute;bottom:4px;left:calc(50% - 3px);width:6px;height:6px;border-radius:50%;background:var(--ac)}
.dp.to{border-color:var(--pr);color:var(--pr)}.dp.on{background:var(--pr);color:#fff;border-color:var(--pr);transform:translateY(-3px);box-shadow:0 8px 18px rgba(15,118,110,.3)}.dp.on::after{background:#fff}
.cl{display:flex;gap:12px;align-items:center;padding:13px;border-radius:20px;background:#fff;border:1px solid var(--bd);border-left:6px solid var(--a);margin-bottom:11px;box-shadow:0 6px 18px rgba(0,0,0,.04)}
.cl .tm{flex:none;width:74px;font-size:13px;color:var(--mu);line-height:1.5}.cl .tm b{display:block;color:var(--a);font-size:14px}
.cl h4{font-size:17px;color:var(--a)}.cl small{color:var(--mu)}
.em{text-align:center;padding:30px 10px;color:var(--mu)}.em b{display:block;font-size:34px;margin-bottom:6px}
/* attendance */
.chs{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}.chs::-webkit-scrollbar{display:none}
.ch{flex:none;padding:7px 14px;border-radius:99px;border:1.5px solid var(--bd);background:#fff;font-size:14px;font-weight:600;transition:.25s}.ch.on{background:var(--a,var(--pr));color:#fff;border-color:transparent;transform:scale(1.05)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.mh button{width:38px;height:38px;border-radius:50%;background:var(--prl);color:var(--pr);font-size:18px;font-weight:700}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.cg span{font-size:12px;color:var(--mu);font-weight:600}
.cg b{aspect-ratio:1;display:grid;place-items:center;border-radius:12px;font-size:14px;font-weight:600;background:#f3f7f7;color:#9ab;animation:up .5s both;animation-delay:calc(var(--i)*14ms)}
.cg b.p{background:#dcfce7;color:var(--ok)}.cg b.l{background:#fef3c7;color:var(--lt)}.cg b.a{background:#fee2e2;color:var(--er)}.cg b.td{outline:2px solid var(--pr);outline-offset:1px}
.lg2{display:flex;gap:12px;justify-content:center;font-size:12px;color:var(--mu);margin-top:10px}.lg2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.rc{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--bd)}.rc:last-child{border:0}
.rc .dt{flex:none;width:48px;text-align:center;border-radius:12px;padding:4px 0;font-weight:700;line-height:1.2}.rc .dt small{display:block;font-size:10px;font-weight:600}
.rc.p .dt{background:#dcfce7;color:var(--ok)}.rc.l .dt{background:#fef3c7;color:var(--lt)}.rc.a .dt{background:#fee2e2;color:var(--er)}
.rc div{flex:1;min-width:0}.rc small{color:var(--mu)}.rc em{font-style:normal;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.rc.p em{background:#dcfce7;color:var(--ok)}.rc.l em{background:#fef3c7;color:var(--lt)}.rc.a em{background:#fee2e2;color:var(--er)}
/* notices */
.nt{background:#fff;border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px;cursor:pointer;position:relative;overflow:hidden}
.nt.nsc{border:1.5px solid #fecaca;background:linear-gradient(135deg,#fff,#fef2f2)}.nt.nsc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--er)}
.nh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}.nh small{color:var(--mu)}
.tg{font-size:12px;font-weight:700;padding:3px 11px;border-radius:99px;background:var(--prl);color:var(--prd)}.nt.nsc .tg{background:#fee2e2;color:#991b1b}.nt.nsc .tg::before{content:"⚠ ";display:inline-block;animation:shk 2.5s infinite}
.nb{max-height:0;overflow:hidden;white-space:pre-wrap;line-height:1.8;color:#334;transition:max-height .5s ease,margin .3s}.nt.op .nb{max-height:1400px;margin-top:10px}.nt .mo{color:var(--mu);font-size:12px}.nt.op .mo{display:none}
/* sheet + toast */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,40,38,.5);display:flex;align-items:flex-end;justify-content:center;animation:fd .25s}
@keyframes fd{from{opacity:0}}
.sh{width:100%;max-width:520px;background:#fff;border-radius:28px 28px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:sl .4s cubic-bezier(.2,.9,.3,1)}
@keyframes sl{from{transform:translateY(100%)}}
.sh h3{font-size:19px;color:var(--prd);margin-bottom:12px}.sh .bt+.bt{margin-top:10px;background:#fff;color:var(--er);border:1.5px solid #fecaca;box-shadow:none}
.ts{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#102a2d;color:#fff;padding:10px 20px;border-radius:99px;z-index:60;font-size:14px;animation:up .4s}
.sk{height:90px;border-radius:22px;margin-bottom:14px;background:linear-gradient(90deg,#e8efef 25%,#f6f9f9 50%,#e8efef 75%);background-size:200% 100%;animation:shim 1.4s infinite}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---- v2: স্লাইডার নেই, সব মোবাইল-রেসপন্সিভ ---- */
.sc{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;overflow:visible;margin:0;padding:0}.tc{width:auto}
.dps{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;overflow:visible;padding:2px 0 12px}.dp{min-width:0;padding:9px 0;font-size:13px}
.chs{display:flex;flex-wrap:wrap;gap:8px;overflow:visible}.ch{padding:8px 14px}
.nv button{min-width:0;font-size:10.5px}.nv svg{width:21px;height:21px}
.fb table{font-size:12px;word-break:break-word}.flip{width:100%}
.cg span{font-size:11px}
.dn{width:176px;height:176px;border-radius:50%;margin:6px auto 16px;display:grid;place-items:center;animation:spn 1.3s cubic-bezier(.2,.8,.2,1) both}
.dn>div{width:124px;height:124px;border-radius:50%;background:#fff;display:grid;place-content:center;text-align:center;box-shadow:inset 0 0 0 1px var(--bd)}.dn b{font-size:30px;line-height:1.1}.dn small{color:var(--mu)}
@keyframes spn{from{transform:rotate(-140deg) scale(.5);opacity:0}}
.lgd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.lgd div{text-align:center;padding:10px 4px;border-radius:14px;background:#f5f8f8;font-size:13px;color:var(--mu)}.lgd i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.lgd b{display:block;font-size:20px;color:var(--tx)}
.vzg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.vzt{display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px 10px 14px;border-radius:20px;background:#f7fafa;border:1.5px solid var(--bd);border-bottom:4px solid var(--a)}
.vzr{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;margin-bottom:10px}
.vzr>div{width:62px;height:62px;border-radius:50%;background:#f7fafa;display:grid;place-items:center;font-size:19px;font-weight:700;color:var(--tx);line-height:1}
.vzr sup{font-size:10px;font-weight:600;color:var(--mu);position:relative;top:-5px}
.vzt b{font-size:15px;color:var(--a);line-height:1.2}.vzt small{color:var(--mu);font-size:12px;margin-top:2px}
.vzd{display:flex;gap:10px;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--tx)}.vzd span{display:inline-flex;align-items:center;gap:4px}.vzd i{width:8px;height:8px;border-radius:50%}
.bw{margin-bottom:16px}.bw:last-child{margin:0}.bh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}.bh small{color:var(--mu)}
.br{display:flex;height:26px;border-radius:99px;overflow:hidden;background:#eef3f3}.br span{width:var(--w);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;animation:gw 1.1s cubic-bezier(.2,.8,.2,1) both}.br em{font-style:normal;margin:auto;font-size:12px;color:var(--mu)}
@keyframes gw{from{width:0}}
.bl{display:flex;justify-content:space-between;gap:4px;margin-top:5px;font-size:12px;font-weight:600}
.pi{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--bd);border-radius:16px;margin-bottom:10px;background:#fff;transition:.2s}.pi:has(input:checked){border-color:var(--pr);background:var(--prl)}
.pi input{width:22px;height:22px;accent-color:var(--pr);flex:none}.pi span{flex:1;min-width:0}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.sg button{padding:11px;border-radius:14px;border:1.5px solid var(--bd);background:#fff;font-weight:700;color:var(--pr)}.sg button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.tt{display:flex;justify-content:space-between;align-items:center;background:var(--prl);border-radius:16px;padding:14px 16px;margin:14px 0;font-size:18px}
